services:
  - type: web
    name: recallcast-api-ankitlade12
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_STORAGE_MODE
        value: b2
      - key: WEB_ORIGINS
        value: https://recallcast-app-ankitlade12.onrender.com
      - key: B2_KEY_ID
        sync: false
      - key: B2_APP_KEY
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_EXTRACTION_MODEL
        value: gpt-5.6
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: OPENAI_TTS_VOICE
        value: coral
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-transcribe
      - key: OPENAI_VISION_MODEL
        value: gpt-5.6-sol
      - key: RECALLCAST_ADMIN_TOKEN
        generateValue: true

  - type: web
    name: recallcast-app-ankitlade12
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://recallcast-api-ankitlade12.onrender.com
